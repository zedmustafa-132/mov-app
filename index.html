<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('MOV could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('MOV could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'MOV could not start on this browser.' : 'MOV is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>MOV</title>
<meta name="description" content="Gamified Fitness & Calorie Coach">
<meta name="theme-color" content="#11100f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOV">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png?v=mov-orange">
<link rel="icon" type="image/svg+xml" href="brand-mark.svg">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen is the logo loading its plates instead of a black
     page. Same dark and lime as the native splash. lib/boot.js takes it away the moment the
     app can draw, so it never adds a wait. -->
<style>
  @font-face{font-family:Manrope;src:url('/fonts/manrope-latin.woff2') format('woff2');font-style:normal;font-weight:400 800;font-display:swap}
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#11100f;color:#f5f2ed;transition:opacity .22s ease-out;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
  #boot.out{opacity:0;pointer-events:none}
  #boot .boot-contours{position:absolute;width:100%;height:100%;inset:0;opacity:.18}
  #boot .boot-content{position:relative;text-align:center}
  #boot .boot-mark{width:88px;height:88px;display:block;margin:0 auto 22px;animation:boot-build .48s cubic-bezier(.2,.8,.3,1.2) both}
  #boot .boot-wordmark{font:800 italic 56px/1 Manrope,system-ui,sans-serif;letter-spacing:-.08em}
  #boot .boot-wordmark span{color:#ff8a3d}
  #boot .boot-tagline{font-size:10px;font-weight:600;letter-spacing:.17em;color:#b6a89b;margin-top:14px}
  #boot .boot-loading{display:flex;gap:5px;width:80px;margin:30px auto 0}
  #boot .boot-loading i{display:block;flex:1;height:4px;background:#ff8a3d;border-radius:2px;animation:boot-load 1.1s ease-in-out infinite}
  #boot .boot-loading i:nth-child(2){animation-delay:.15s}
  #boot .boot-loading i:nth-child(3){animation-delay:.3s}
  #boot .boot-loading i:nth-child(4){animation-delay:.45s}
  @keyframes boot-build{from{opacity:0;transform:translateY(14px) scale(.75) rotate(-12deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
  @keyframes boot-load{0%,100%{opacity:.25;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1)}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#e6e8ec;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#1a1d24;color:#a9b0bc;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#0c0e12;background:#ff7939;border:0;border-radius:12px;min-height:44px;padding:0 28px}
  @media (prefers-reduced-motion:reduce){
    #boot .boot-mark,#boot .boot-loading i{animation:none}
  }
</style>
<div id="boot" aria-hidden="true">
  <svg class="boot-contours" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#bfa58e" stroke-width="1"><path d="M-80 100C200-200 480 140 300 350S80 450 210 700 580 860 480 1000M-60 120C200-160 450 140 280 350S65 470 190 710 550 880 460 1000M-40 140C200-120 420 140 260 350S50 490 170 720 520 900 440 1000M-20 160C200-80 390 140 240 350S35 510 150 730 490 920 420 1000M0 180C200-40 360 140 220 350S20 530 130 740 460 940 400 1000"/></svg>
  <div class="boot-content">
    <svg class="boot-mark" viewBox="0 0 64 64"><path fill="#ff8a3d" d="M22 3h20l19 19v20L42 61H22L3 42V22Z"/><path fill="#20120c" d="M14 44V20h10l8 11 8-11h10v24H40V34l-8 10-8-10v10Z"/><path fill="#fff" opacity=".3" d="M22 3h20l7 7H19l-9 9v-4Z"/></svg>
    <div class="boot-wordmark">MOV<span>.</span></div>
    <div class="boot-tagline">EVERY MOVE COUNTS</div>
    <div class="boot-loading"><i></i><i></i><i></i><i></i></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
